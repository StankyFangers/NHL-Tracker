name: NHL Tracker v1.8.17 DEV feature validation

on:
  push:
    branches:
      - feature/v1.8.17-player-analytics-export-leg-colors
    paths:
      - src/renderer/src/App.tsx
      - src/renderer/src/styles.css
      - src/renderer/src/PlayerWagerAnalytics.tsx
      - src/renderer/src/playerWagerAnalytics.css
      - src/renderer/src/wagerLegEvidence.ts
      - tests/playerAnalyticsFeatures.test.mjs
      - .github/workflows/nhl-v1817-dev-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Verify history analytics, grading and renderer
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run regressions
        run: node --test tests/playerAnalyticsFeatures.test.mjs tests/slateFinalization.test.mjs tests/teamConfidenceFlags.test.mjs tests/electronUpdaterMigration.test.mjs
      - name: Compile renderer and Electron main
        run: npm run build
