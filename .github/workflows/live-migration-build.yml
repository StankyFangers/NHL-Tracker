name: LIVE migration build safety
on:
  push:
    branches:
      - feature/live-wager-cloud-transport
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Test historical migration safeguards
        run: |
          npx esbuild tests/liveMigrationPreflight.test.mjs tests/liveMigrationUpload.test.mjs --bundle --platform=node --format=esm --out-extension:.js=.mjs --outdir=/tmp/nhl-migration-tests
          node --test /tmp/nhl-migration-tests/*.test.mjs
      - name: Build Electron renderer and main process
        run: npm run build
      - name: Type-check renderer
        run: npx tsc --noEmit -p tsconfig.web.json
      - name: Type-check main process
        run: npx tsc --noEmit -p tsconfig.node.json
