name: Publish NHL Tracker Windows Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install dependencies
        run: npm ci
      - name: Build Electron assets
        run: npm run build
      - name: Build Windows setup executable
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installer exists
        shell: pwsh
        run: |
          $files = Get-ChildItem release -Filter '*.exe'
          if ($files.Count -lt 1) { throw 'No Windows installer was generated' }
          $files | ForEach-Object { Write-Host "$($_.Name) - $($_.Length) bytes" }
      - name: Publish GitHub Release (downloadable from Check for Updates)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NHL Tracker v${{ steps.version.outputs.version }}
          body: |
            NHL Tracker v1.7.9
            - Pregame compact scoreboard now shows total Units Bet per team across every wager category.
            - Bet Tracker groups wagers by matchup, then by Combos / Assists / Other / custom category.
            - Configurable category dropdowns in Settings, including Apply to All Sports.
            - Assist-only bets default to the Assists category.
            - Existing wagers retain their saved categories.

            Download the Windows Setup .exe attached below. In NHL Tracker v1.7.8, use Settings > Check for Updates > Download Update to reach this release.
            This updater opens the download page; installation is manual.
          files: release/*.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
