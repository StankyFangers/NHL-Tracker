name: Build NHL Tracker Linux

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npx electron-vite build

      - name: Package Chromebook installer
        run: npx electron-builder --linux deb --x64 --config.directories.output=release-linux --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NHL-Tracker-Chromebook-Beta
          path: release-linux/*.deb
          if-no-files-found: error
