name: NHL Tracker 1.8.0 Boys Tester Installer

on:
  workflow_dispatch:
  push:
    branches:
      - feature/telegram-notifications
    paths:
      - .github/workflows/nhl-tester-installer.yml

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tester branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Kalshi repeat-sync regression checks
        run: node --test tests/kalshiCategoryPreservation.test.mjs

      - name: Build Electron production files
        run: npm run build

      - name: Package unsigned Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify installer exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter '*.exe' -File -ErrorAction Stop
          if (-not $exe -or $exe.Count -lt 1) { throw "No Windows installer was created." }
          $exe | ForEach-Object { Write-Host "Installer: $($_.Name), bytes: $($_.Length)" }

      - name: Upload boys' installer
        uses: actions/upload-artifact@v4
        with:
          name: NHL-Tracker-v1.8.0-BOYS-TESTER-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
