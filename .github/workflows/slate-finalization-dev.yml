name: NHL Tracker slate finalization DEV validation

on:
  push:
    branches:
      - feature/v1.8.16-slate-finalization-fix
    paths:
      - src/renderer/src/App.tsx
      - tests/slateFinalization.test.mjs
      - .github/workflows/slate-finalization-dev.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test slate classification and existing regressions
        run: node --test tests/slateFinalization.test.mjs tests/electronUpdaterMigration.test.mjs tests/kalshiCategoryPreservation.test.mjs tests/kalshiAmericanOdds.test.mjs
      - name: Build Electron
        run: npm run build
