name: NHL Tracker v1.8.13 Windows Release

on:
  push:
    branches:
      - release/v1.8.13-updater-acceptance
    paths:
      - .github/workflows/nhl-v1813-release.yml
      - src/main/index.ts
      - src/main/appUpdater.ts
      - tests/electronUpdaterMigration.test.mjs
      - src/renderer/src/sectionColors.css
      - src/preload/index.ts
      - src/renderer/src/playerIdentityDb.ts
      - src/renderer/src/kalshiImport.ts
      - src/renderer/src/KalshiNHL.tsx
      - tests/playerIdentityCollision.test.mjs
      - tests/updateCoordinator.test.mjs
      - src/renderer/src/App.tsx
      - src/renderer/src/SportsbookCatalogSettings.tsx
      - src/renderer/src/sportsbookCatalog.ts
      - src/renderer/src/sportsbookCatalog.css
      - src/renderer/src/sportsbookBalances.tsx
      - src/renderer/src/sportsbookBalances.css
      - tests/sportsbookPricingFormats.test.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhl-tracker-v1.8.13-release
  cancel-in-progress: false

jobs:
  release-windows:
    name: Verify, build and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Confirm release version
        shell: bash
        run: |
          node -e "const p=require('./package.json');if(p.version!=='1.8.13')process.exit(1)"
          node -e "const p=require('./package-lock.json');if(p.version!=='1.8.13'||p.packages[''].version!=='1.8.13')process.exit(1)"

      - name: Resolve and commit electron-updater dependency lockfile
        shell: bash
        run: |
          # Electron-updater introduces runtime dependencies not present in the
          # old lockfile. Resolve the complete npm dependency graph once and
          # commit the exact lock before any installer is built.
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock electron-updater dependencies for v1.8.13"
            git push origin HEAD:refs/heads/release/v1.8.13-updater-acceptance
          fi
          node -e "const p=require('./package-lock.json');if(!p.packages['node_modules/electron-updater'])process.exit(1)"
          echo "Exact updater dependency graph is committed."

      - name: Install exact lockfile dependencies (retry transient Electron download failures)
        shell: pwsh
        env:
          npm_config_fetch_retries: '4'
          npm_config_fetch_retry_mintimeout: '20000'
          npm_config_fetch_retry_maxtimeout: '120000'
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            # Electron downloads a separate binary during npm ci. The official
            # GitHub release endpoint has repeatedly returned HTTP 504.
            # Try the mirror documented by Electron, then the official source.
            if ($attempt -eq 2) {
              Remove-Item Env:ELECTRON_MIRROR -ErrorAction SilentlyContinue
              Write-Host "npm ci attempt $attempt of 3 (official Electron GitHub releases)"
            } else {
              $env:ELECTRON_MIRROR = 'https://npmmirror.com/mirrors/electron/'
              Write-Host "npm ci attempt $attempt of 3 (Electron documented CDN mirror)"
            }
            & npm.cmd ci
            if ($LASTEXITCODE -eq 0) {
              Write-Host "npm ci succeeded."
              exit 0
            }
            if ($attempt -eq 3) {
              throw "npm ci failed after three attempts (last exit code $LASTEXITCODE)"
            }
            Write-Warning "Dependency install failed; retrying after 20 seconds."
            Start-Sleep -Seconds 20
          }

      - name: Validate updater migration and NHL wager regression tests
        shell: bash
        run: |
          echo "Build revision: $(git rev-parse HEAD)"
          test -f src/main/appUpdater.ts
          test -f tests/electronUpdaterMigration.test.mjs
          node --test tests/electronUpdaterMigration.test.mjs tests/kalshiCategoryPreservation.test.mjs tests/kalshiAmericanOdds.test.mjs tests/sportsbookPricingFormats.test.mjs tests/playerIdentityCollision.test.mjs
          npm ls electron-updater builder-util-runtime --depth=0

      - name: Run cloud monitoring unit tests (Windows-safe discovery)
        working-directory: telegram-cloud
        run: npm test

      - name: Build production Electron app
        run: npm run build

      - name: Create Windows NSIS installer (Electron and NSIS mirrors)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          # Electron runtime and electron-builder toolsets (NSIS, resources,
          # winCodeSign) use TWO different download source settings.
          # Both must be configured; the previous attempts only set Electron.
          $sources = @(
            @{ Name = 'npmmirror'; Electron = 'https://npmmirror.com/mirrors/electron/'; Builder = 'https://npmmirror.com/mirrors/electron-builder-binaries/' },
            @{ Name = 'Huawei mirror'; Electron = 'https://npmmirror.com/mirrors/electron/'; Builder = 'https://mirrors.huaweicloud.com/electron-builder-binaries/' },
            @{ Name = 'official GitHub'; Electron = ''; Builder = '' }
          )
          for ($i = 0; $i -lt $sources.Count; $i++) {
            $source = $sources[$i]
            Write-Host "NSIS packaging attempt $($i+1) of $($sources.Count): $($source.Name)"
            if ($source.Electron) {
              $env:ELECTRON_MIRROR = $source.Electron
            } else {
              Remove-Item Env:ELECTRON_MIRROR -ErrorAction SilentlyContinue
            }
            if ($source.Builder) {
              $env:ELECTRON_BUILDER_BINARIES_MIRROR = $source.Builder
            } else {
              Remove-Item Env:ELECTRON_BUILDER_BINARIES_MIRROR -ErrorAction SilentlyContinue
            }
            Write-Host "Electron source: $($source.Electron)"
            Write-Host "NSIS/toolset source: $($source.Builder)"
            & .\node_modules\.bin\electron-builder.cmd --win nsis --x64 --publish never
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'Windows NSIS installer packaged successfully.'
              exit 0
            }
            if ($i -eq $sources.Count - 1) {
              throw "NSIS packaging failed for all three sources (last exit code $LASTEXITCODE)"
            }
            Write-Warning "Packaging source failed; switching mirrors in 15 seconds."
            Start-Sleep -Seconds 15
          }

      - name: Verify installer, update manifest, and checksum metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item -LiteralPath 'release/NHL.Tracker.Setup.1.8.13.exe' -ErrorAction Stop
          $manifest = Get-Item -LiteralPath 'release/latest.yml' -ErrorAction Stop
          $blockmap = Get-Item -LiteralPath 'release/NHL.Tracker.Setup.1.8.13.exe.blockmap' -ErrorAction Stop
          if ($exe.Length -lt 1000000) { throw 'Installer is unexpectedly small' }
          if ($blockmap.Length -lt 100) { throw 'Differential update blockmap missing/empty' }
          $manifestText = Get-Content -LiteralPath $manifest.FullName -Raw
          if ($manifestText -notmatch 'version:\s*1\.8\.12') { throw 'latest.yml has wrong version' }
          if ($manifestText -notmatch 'NHL\.Tracker\.Setup\.1\.8\.12\.exe') { throw 'latest.yml does not point to release installer' }
          if ($manifestText -notmatch 'sha512:') { throw 'latest.yml is missing checksum' }
          if ($manifestText -notmatch 'size:') { throw 'latest.yml is missing installer size' }
          Write-Host "Verified: $($exe.Name), latest.yml, and $($blockmap.Name)"

      - name: Upload verified Windows updater release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NHL-Tracker-v1.8.13-Windows-Updater
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # Publish only after building the final branch revision, not superseded commits.
      - name: Check whether this is the latest branch revision
        id: freshness
        shell: bash
        run: |
          latest=$(git ls-remote origin refs/heads/release/v1.8.13-updater-acceptance | cut -f1)
          built=$(git rev-parse HEAD)
          if [ "$latest" = "$built" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "This build is superseded by a newer commit. Skipping publication safely."
          fi

      - name: Publish GitHub Release (Check for Updates)
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## NHL Tracker v1.8.13 — In-app updater acceptance test

          This release intentionally changes only the application version.
          It is designed to verify the first complete in-app update using
          electron-updater, introduced in v1.8.12.

          **Test from installed v1.8.12**
          1. Open Settings > Updates > Check for Updates.
          2. Download v1.8.13 in the app.
          3. Choose Install & Restart and allow the installer to finish.
          4. Confirm the app reopens, reports v1.8.13, and keeps existing wagers,
             settings and its custom installation directory.

          **What's unchanged**
          - Balances button theme, betting behavior and cloud account APIs
          - Windows NSIS application identity and user data storage
          - Official GitHub Releases latest.yml plus checksum/blockmap metadata

          A green Windows build does not prove the updater succeeds until the
          installed Windows application completes the end-to-end update.
          EOF
          if gh release view "v1.8.13" >/dev/null 2>&1; then
            gh release upload "v1.8.13" release/*.exe release/*.yml release/*.blockmap --clobber
            gh release edit "v1.8.13" --title "NHL Tracker v1.8.13 — Boys Tester Release" --notes-file release-notes.md --latest
          else
            gh release create "v1.8.13" release/*.exe release/*.yml release/*.blockmap \
              --target "$(git rev-parse HEAD)" \
              --title "NHL Tracker v1.8.13 — Boys Tester Release" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Confirm GitHub Release is visible
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v1.8.13" --json tagName,isDraft,isPrerelease,assets,url
