name: Publish NHL Tracker v1.7.10 Windows release
on:
  push:
    paths:
      - '.github/workflows/publish-v1.7.10.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify package version and release is not already published
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.7.10') { throw "Expected v1.7.10, found $($pkg.version)" }
          gh release view v1.7.10 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'v1.7.10 release already exists; refusing to overwrite it' }
          exit 0
      - name: Install dependencies
        run: npm ci
      - name: Build Windows NSIS installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installer exists and is nonempty
        shell: pwsh
        run: |
          $file = 'release/NHL Tracker Setup 1.7.10.exe'
          if (!(Test-Path -LiteralPath $file)) { throw "Missing expected installer: $file" }
          $bytes = (Get-Item -LiteralPath $file).Length
          if ($bytes -lt 10000000) { throw "Installer unexpectedly small: $bytes bytes" }
          Write-Host "Verified installer: $bytes bytes"
      - name: Create versioned GitHub release with installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          NHL Tracker v1.7.10 — Windows Desktop

          Highlights:
          - Bet Tracker Accordion Memory: remembers LIVE / PENDING, FINALIZED GAMES, individual matchups and nested categories by slate date; starts collapsed by default.
          - Section Color Integration: subtle coordinated tints across top navigation, scoreboard tiles, Bet Tracker and Live Event Tracker cards.
          - Matchup accordion P/L currency formatting improvements.
          - All other existing cloud accounts, bet tracking, confidence, and live NHL features are retained.

          Installation:
          Download and run "NHL Tracker Setup 1.7.10.exe". Use your existing NHL Tracker account to sign in.
          Windows may display a SmartScreen warning for an unsigned installer.

          Note: This release is an installer update, not a cloud wager migration.
          '@
          $notes | Set-Content -LiteralPath release-notes.txt -Encoding utf8
          gh release create v1.7.10 "release/NHL Tracker Setup 1.7.10.exe" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "NHL Tracker v1.7.10" --notes-file release-notes.txt --latest
