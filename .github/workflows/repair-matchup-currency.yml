name: Repair matchup currency from known-good source
on:
  push:
    paths:
      - '.github/workflows/repair-matchup-currency.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore verified baseline and change only matchup currency
        run: |
          git show 77390e6:src/renderer/src/App.tsx > src/renderer/src/App.tsx
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/renderer/src/App.tsx")
          s=p.read_text()
          a=" const money=(n:number)=>`${n>=0?'+':'-'}${Math.abs(n).toFixed(2)}`"
          b=" const money=(n:number)=>(n<0?'-$':'+$')+Math.abs(n).toFixed(2)"
          assert s.count(a)==1, "Expected formatter missing or duplicated"
          p.write_text(s.replace(a,b))
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit only after successful build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/App.tsx
          git diff --cached --quiet || (git commit -m "Restore known-good App.tsx and format matchup net as USD" && git push origin HEAD:main)
